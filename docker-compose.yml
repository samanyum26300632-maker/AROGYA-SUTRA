services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://arogya:arogya@postgres:5432/arogya
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: local-compose-secret-change-me
      AUTO_CREATE_TABLES: "true"
      CORS_ORIGINS: http://localhost:3000,https://your-production-frontend.example
    depends_on: [postgres, redis]
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: arogya, POSTGRES_USER: arogya, POSTGRES_PASSWORD: arogya}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes: {pgdata: {}}
